name: CreceTrader · ciclo horario PAPER_ONLY

# Un solo job por hora hace TODO lo que en el Mac hacen 6 launchd:
#   actualizar velas → 3 trackers → alertas Discord → regenerar dash → commit
# Repo privado: 2000 min/mes gratis. Este job tarda ~40s => ~480 min/mes.
# PAPER_ONLY: ninguna orden real. Nunca se ejecuta trading.

on:
  schedule:
    # :07 UTC, justo tras el cierre de la vela 1h (en el Mac los trackers van :01/:02/:03)
    - cron: '7 * * * *'
  workflow_dispatch:   # permite probarlo a mano sin esperar una hora

permissions:
  contents: write

concurrency:
  group: crecetrader-ciclo
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sin dependencias externas
        run: python3 -c "import json,urllib.request,pathlib; print('stdlib OK')"

      - name: 1/5 · Actualizar velas (13 pares, 1h+4h, incremental)
        working-directory: ./daily_pilot
        run: python3 scripts/actualizar_velas.py

      - name: 2/5 · Trackers (scale-in, paper, BOS)
        working-directory: ./daily_pilot
        run: |
          python3 scripts/tracker_scalein.py
          python3 scripts/tracker_paper.py
          python3 scripts/tracker_bos.py

      - name: 3/5 · Alertas a Discord (si hay webhook cargado)
        working-directory: ./daily_pilot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            python3 scripts/alertas_senales.py
          else
            echo "DISCORD_WEBHOOK_URL no configurado; se omite (PAPER_ONLY)"
          fi

      - name: 4/5 · Regenerar dash
        working-directory: ./daily_pilot
        run: python3 scripts/generar_dashboard_v6.py

      - name: 5/5 · Suite de tests (solo lectura)
        working-directory: ./daily_pilot
        run: python3 tests/run_all.py

      - name: Guardar resultados (commit)
        run: |
          git config user.name "franotamendi7-commits"
          git config user.email "franotamendi7-commits@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "AUTO ciclo PAPER_ONLY $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
