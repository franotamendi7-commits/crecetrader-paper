name: CreceTrader · publicar dash (GitHub Pages)

# Se dispara cuando ciclo-paper.yml commitea el index.html generado.
# Publica ese HTML en la rama gh-pages, que GitHub Pages sirve en:
# https://franotamendi7-commits.github.io/crecetrader-paper/
# Sin artifacts: push directo, confiable.

on:
  push:
    branches: [crecetrader-limpio]
    paths:
      - 'daily_pilot/dashboard/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar en rama gh-pages
        run: |
          set -e
          git config user.name "franotamendi7-commits"
          git config user.email "franotamendi7-commits@users.noreply.github.com"
          mkdir -p /tmp/pub
          cp daily_pilot/dashboard/index.html /tmp/pub/index.html
          git checkout -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'index.html' -exec rm -rf {} +
          cp /tmp/pub/index.html index.html
          git add -A -f
          if git diff --cached --quiet; then
            echo "dash sin cambios"
          else
            git commit -m "AUTO dash $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -f origin gh-pages
            echo "publicado: $(wc -c < index.html) bytes"
          fi
