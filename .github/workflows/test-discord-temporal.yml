name: TEST · alerta Discord (temporal)

# Prueba controlada: inyecta una señal forward falsa, envía a Discord, limpia.
# Se borra después de la prueba.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inyectar, enviar y limpiar
        working-directory: ./daily_pilot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, sys, os
          from pathlib import Path
          D=Path('datos'); J=D/'tracker_scalein.json'; EST=D/'alertas_senales_estado.json'
          TS=1795600000000; KEY='TESTBTC-'+str(TS)
          j=json.loads(J.read_text()); est=json.loads(EST.read_text()) if EST.exists() else {}
          for k in list(est): est[k]=[x for x in est[k] if x!=KEY]
          EST.write_text(json.dumps(est,indent=2))
          j['operaciones'].append({'id':KEY,'par':'TESTBTCUSDT','senal_ts':TS,
            'senal_fecha':'2026-11-26 13:30','origen':'forward','estrategia':'TEST',
            'entrada':60123.45,'stop':58400.0,'target':62900.0,
            'resultado_usd':0.0,'estado':'CERRADA_TEST'})
          j['operaciones'].sort(key=lambda o:(o['senal_ts'],o['par']))
          J.write_text(json.dumps(j,indent=2,ensure_ascii=False)+'\n')
          sys.path.insert(0,'scripts')
          import alertas_senales as A
          msgs=[m for m in A.construir() if 'TESTBTC' in m]
          url=A.webhook()
          ok=A.enviar(msgs[0],url) if msgs and url else False
          j2=json.loads(J.read_text())
          j2['operaciones']=[o for o in j2['operaciones'] if o.get('id')!=KEY]
          J.write_text(json.dumps(j2,indent=2,ensure_ascii=False)+'\n')
          e2=json.loads(EST.read_text()) if EST.exists() else {}
          for k in list(e2): e2[k]=[x for x in e2[k] if x!=KEY]
          EST.write_text(json.dumps(e2,indent=2))
          print('MENSAJE GENERADO:',bool(msgs))
          print('WEBHOOK PRESENTE:',bool(url))
          print('HTTP 204 ENVIADO:',ok)
          print('SENAL TEMPORAL ELIMINADA:',not any(o.get('id')==KEY for o in j2['operaciones']))
          if msgs: print('CONTENIDO:',msgs[0])
          PY
